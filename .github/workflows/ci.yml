name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Syntax
        run: for f in checks/*.mjs; do node --check "$f"; done

      # Both checkers must stay runnable and produce parseable output. They are
      # report-only by design, so a zero exit proves nothing on its own; parsing
      # the JSON is what proves they actually produced a result.
      - name: check-ci-coverage produces valid JSON
        run: |
          node checks/check-ci-coverage.mjs . --json > /tmp/coverage.json
          node -e "const j=require('/tmp/coverage.json'); if(!Array.isArray(j.repos)) throw new Error('no repos array'); console.log('ok: scanned', j.scanned)"

      - name: check-amplitude runs and classifies
        run: |
          node checks/check-amplitude.mjs . | tee /tmp/amplitude.txt
          grep -q "SKIP: no package.json" /tmp/amplitude.txt

  # Runs the shared workflow against this repo. There is no pyproject.toml or
  # package.json here, so every gate should report SKIP — which is exactly the
  # path worth smoke-testing, since a broken SKIP branch would silently pass
  # for every consumer whose stack is not detected.
  self-invoke:
    uses: ./.github/workflows/ci-baseline.yml

  # Exercises the OTHER path: enable-codeql on, with an explicit language
  # because auto-detection finds no stack here. This is the only place the
  # enabled branch is proven, and it doubles as the worked example of the
  # permissions a caller must grant.
  self-invoke-codeql:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/ci-baseline.yml
    with:
      enable-codeql: true
      codeql-languages: javascript-typescript
