# Portfolio CI baseline — one gate set, called by every repo instead of copied into each.
#
# Caller stub (put in <repo>/.github/workflows/ci.yml):
#   name: CI
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     baseline:
#       uses: Dobeu-tech-eco/standards/.github/workflows/ci-baseline.yml@<40-char-sha>  # v1.1
#
# Pin the full commit SHA, not a bare tag or @main. Tags here are immutable once
# released — GitHub locks a tag against force-updates once a Release exists on it
# (confirmed: force-pushing v1 was rejected server-side, GH013, after its Release
# was published) — so a change ships as a NEW tag (v1.1, v1.2, ...), never by
# moving an old one. Resolve whichever tag you want to its commit:
#
#   git ls-remote https://github.com/Dobeu-tech-eco/standards 'v1.1^{}'
#
# The `^{}` matters. Without it you get the annotated tag object, which is also
# 40 hex characters but is not a commit and will not resolve at runtime.
#
# CodeQL here is a FALLBACK, not the recommended route. Prefer GitHub's code
# scanning DEFAULT SETUP: it needs no workflow file, no permissions block, and
# no action SHA to keep pinned, and it picks up languages on its own.
# si-agent-core already runs that way (workflow
# `dynamic/github-code-quality/codeql`, no file in .github/workflows).
#
# `enable-codeql: true` exists only for repos that CANNOT use default setup —
# it is off by default, and a repo already on default setup must leave it off.
# GitHub rejects uploads from an advanced configuration while default setup is
# enabled ("CodeQL analyses from advanced configurations cannot be
# processed..."), so turning this on there breaks a scan that already works.
#
# A caller that does enable it MUST also widen its own permissions block — the
# codeql job deliberately declares none, so it inherits the caller's token:
#
#   permissions:
#     contents: read
#     security-events: write   # required to upload the SARIF results
#     actions: read            # additionally required on a private repo
#
# Leaving `enable-codeql` at its default skips the job entirely and asks for no
# extra permission, so existing callers declaring only `contents: read` are
# unaffected.
name: CI Baseline
on:
  workflow_call:
    inputs:
      stack:
        description: 'auto | node | python | both — auto detects from pyproject.toml / package.json'
        type: string
        default: auto
      node-version:
        type: string
        default: '22'
      python-version:
        type: string
        default: '3.12'
      uv-version:
        type: string
        default: '0.12.15'
      # Pinned for the same reason uv is: corepack's own fallback floats, so an
      # unpinned baseline installs a different package manager week to week even
      # at a fixed workflow SHA. Overridable per caller; a repo that declares
      # packageManager in package.json wins over both.
      pnpm-version:
        description: >-
          pnpm used when package.json declares no packageManager. Held on the 10
          line: pnpm 12 stopped reading the package.json "pnpm" field, so moving
          a repo forward is a per-repo migration (overrides ->
          pnpm-workspace.yaml), not a CI default.
        type: string
        default: '10.34.5'
      yarn-version:
        description: >-
          yarn used when package.json declares no packageManager. Berry, because
          the install below passes --immutable, which classic yarn 1.x does not
          accept.
        type: string
        default: '4.18.1'
      test-cmd:
        description: >-
          Override the detected test command. Empty string uses the stack
          default (uv run pytest for python, the package.json "test" script
          for node) and only SKIPs if that default doesn't exist either.
        type: string
        default: ''
      lint-cmd:
        description: >-
          Override the detected lint command. Same empty-string behavior as
          test-cmd: falls back to the stack default, SKIPs only if none exists.
        type: string
        default: ''
      typecheck-cmd:
        description: >-
          Override the detected typecheck command. Same empty-string behavior
          as test-cmd: falls back to the stack default, SKIPs only if none
          exists.
        type: string
        default: ''
      build-cmd:
        description: >-
          Override the detected build command. node runs its package.json
          "build" script; python|both have no default at all — see the Build
          step for why.
        type: string
        default: ''
      enforce-amplitude:
        description: 'true fails the build on an Amplitude policy violation; false reports only.'
        type: boolean
        default: false
      enable-codeql:
        description: >-
          Fallback scan for repos that cannot use GitHub's code scanning default
          setup — prefer default setup. true requires security-events: write in
          the CALLER's permissions block, and default setup disabled for that
          repo.
        type: boolean
        default: false
      codeql-languages:
        description: >-
          Comma-separated CodeQL languages (e.g. javascript-typescript,python).
          Empty derives them from the detected stack; a stack with no CodeQL
          language skips the scan.
        type: string
        default: ''
      standards-repo:
        type: string
        default: Dobeu-tech-eco/standards
      standards-ref:
        type: string
        default: main
jobs:
  baseline:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect stack
        id: detect
        env:
          STACK_INPUT: ${{ inputs.stack }}
        run: |
          stack="$STACK_INPUT"
          if [ "$stack" = auto ]; then
            has_py=false; has_node=false
            if [ -f pyproject.toml ]; then has_py=true; fi
            if [ -f package.json ]; then has_node=true; fi
            if   $has_py && $has_node; then stack=both
            elif $has_py;              then stack=python
            elif $has_node;            then stack=node
            else                            stack=none
            fi
          fi
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          echo "Resolved stack: $stack"
          pm=npm
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; fi
          if [ -f yarn.lock ]; then pm=yarn; fi
          echo "pm=$pm" >>"$GITHUB_OUTPUT"

      - if: steps.detect.outputs.stack == 'node' || steps.detect.outputs.stack == 'both'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - if: steps.detect.outputs.stack == 'python' || steps.detect.outputs.stack == 'both'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          UV_PIN: ${{ inputs.uv-version }}
          PNPM_PIN: ${{ inputs.pnpm-version }}
          YARN_PIN: ${{ inputs.yarn-version }}
        run: |
          # `corepack enable` alone is NOT deterministic, however correct it looks.
          # With no packageManager field, corepack installs its own latest
          # known-good release: on dts-contract-engine that resolved to pnpm
          # 12.6.0, which no longer reads the package.json "pnpm" field, so
          # pnpm.overrides were silently dropped and --frozen-lockfile failed
          # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Nothing had changed in the
          # repo or in this workflow. So: honor a declared packageManager (the
          # repo's explicit choice), otherwise activate a pinned version.
          # Do not "simplify" this back to a bare `corepack enable`.
          case "$STACK" in
            node|both)
              if [ "$PM" = pnpm ] || [ "$PM" = yarn ]; then
                corepack enable
                declared=$(node -e '
                  try {
                    const p = JSON.parse(require("fs").readFileSync("package.json", "utf8"));
                    const d = p.devEngines && p.devEngines.packageManager;
                    const v = typeof p.packageManager === "string" ? p.packageManager
                            : (d && typeof d.version === "string" ? d.name + "@" + d.version : "");
                    process.stdout.write(v);
                  } catch {}
                ' 2>/dev/null || true)
                if [ -n "$declared" ]; then
                  echo "package.json declares $declared — corepack honors it."
                else
                  if [ "$PM" = pnpm ]; then pin="$PNPM_PIN"; else pin="$YARN_PIN"; fi
                  echo "No packageManager declared — activating pinned $PM@$pin"
                  corepack prepare "$PM@$pin" --activate
                fi
              fi
              if [ "$PM" = pnpm ]; then
                pnpm install --frozen-lockfile
              elif [ "$PM" = yarn ]; then
                yarn install --immutable
              elif [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac
          case "$STACK" in
            python|both)
              python -m pip install "uv==$UV_PIN"
              if [ -f uv.lock ]; then uv sync --frozen; else uv sync; fi
              ;;
          esac

      # Each gate runs the override when given, else the stack default, else skips
      # with a visible SKIP line. A missing gate is reported, never silently passed.
      - name: Test
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.test-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both) cmd='uv run pytest -q' ;;
              node)
                if node -e '
                  try {
                    const s = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts || {};
                    process.exit(s.test ? 0 : 1);
                  } catch { process.exit(1); }
                ' 2>/dev/null; then cmd="$PM test"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP test — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      - name: Lint
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.lint-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both) cmd='uv run ruff check . && uv run ruff format --check .' ;;
              node)
                if node -e '
                  try {
                    const s = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts || {};
                    process.exit(s.lint ? 0 : 1);
                  } catch { process.exit(1); }
                ' 2>/dev/null; then cmd="$PM run lint"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP lint — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      - name: Typecheck
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.typecheck-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both)
                if [ -d src ]; then cmd='uv run mypy --strict src'; fi
                ;;
              node)
                if node -e '
                  try {
                    const s = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts || {};
                    process.exit((s.typecheck || s["type-check"]) ? 0 : 1);
                  } catch { process.exit(1); }
                ' 2>/dev/null; then cmd="$PM run typecheck"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP typecheck — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      - name: Build
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.build-cmd }}
        run: |
          # The empty python|both arm is deliberate, not an oversight. pytest and
          # ruff are conventions every Python repo can be held to; "build" is not.
          # `uv build` means "produce a wheel", which is right for a published
          # package and meaningless for an application or a service — running it
          # by default would fail repos that ship no distribution at all.
          # si-agent-core does run `uv build`, but as ITS packaging step, not as a
          # portfolio norm. A Python caller that builds something passes build-cmd.
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both) : ;;
              node)
                if node -e '
                  try {
                    const s = JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts || {};
                    process.exit(s.build ? 0 : 1);
                  } catch { process.exit(1); }
                ' 2>/dev/null; then cmd="$PM run build"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP build — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      # Portfolio policy gate. Needs its own checkout because the job's working
      # tree is the CALLER, not the standards repo. A private standards repo
      # needs a token with read access here — GITHUB_TOKEN will not reach it,
      # so the fetch carries the same continue-on-error as the check itself.
      - name: Fetch standards checks
        continue-on-error: ${{ !inputs.enforce-amplitude }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.standards-repo }}
          ref: ${{ inputs.standards-ref }}
          path: .standards
          persist-credentials: false

      - name: Amplitude instrumentation policy
        continue-on-error: ${{ !inputs.enforce-amplitude }}
        run: node .standards/checks/check-amplitude.mjs .

  # Opt-in security scan. Declares NO permissions block on purpose: a job in a
  # called workflow that requests nothing inherits the caller's token, so callers
  # that never enable this are never asked for security-events: write. See the
  # header for what a caller must grant before flipping enable-codeql.
  codeql:
    if: inputs.enable-codeql
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same auto-detection as the baseline job, mapped onto CodeQL language
      # ids. Resolving to an empty list is a normal outcome (a docs-only repo),
      # not a failure — the remaining steps skip and say so.
      - name: Resolve CodeQL languages
        id: detect
        env:
          STACK_INPUT: ${{ inputs.stack }}
          LANG_INPUT: ${{ inputs.codeql-languages }}
        run: |
          langs="$LANG_INPUT"
          if [ -z "$langs" ]; then
            stack="$STACK_INPUT"
            if [ "$stack" = auto ]; then
              has_py=false; has_node=false
              if [ -f pyproject.toml ]; then has_py=true; fi
              if [ -f package.json ]; then has_node=true; fi
              if   $has_py && $has_node; then stack=both
              elif $has_py;              then stack=python
              elif $has_node;            then stack=node
              else                            stack=none
              fi
            fi
            case "$stack" in
              node)   langs=javascript-typescript ;;
              python) langs=python ;;
              both)   langs=javascript-typescript,python ;;
            esac
          fi
          echo "languages=$langs" >>"$GITHUB_OUTPUT"
          if [ -z "$langs" ]; then
            echo "SKIP codeql — no CodeQL language for the detected stack."
          else
            echo "CodeQL languages: $langs"
          fi

      - if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ steps.detect.outputs.languages }}

      - if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
