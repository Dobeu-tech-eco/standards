# Portfolio CI baseline — one gate set, called by every repo instead of copied into each.
#
# Caller stub (put in <repo>/.github/workflows/ci.yml):
#   name: CI
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     baseline:
#       uses: Dobeu-tech-eco/standards/.github/workflows/ci-baseline.yml@<40-char-sha>  # v1
#
# Pin the full commit SHA, not @v1 or @main — both are mutable. `v1` is a label for
# finding the current blessed commit: git ls-remote <repo> v1.
#
# NOT YET CALLABLE: this file must live in a repo published to GitHub before any
# `uses:` reference resolves. See the rollout notes reported alongside this file.
name: CI Baseline
on:
  workflow_call:
    inputs:
      stack:
        description: 'auto | node | python | both — auto detects from pyproject.toml / package.json'
        type: string
        default: auto
      node-version:
        type: string
        default: '22'
      python-version:
        type: string
        default: '3.12'
      uv-version:
        type: string
        default: '0.12.15'
      test-cmd:
        description: 'Override the detected test command. Empty string skips the gate.'
        type: string
        default: ''
      lint-cmd:
        type: string
        default: ''
      typecheck-cmd:
        type: string
        default: ''
      enforce-amplitude:
        description: 'true fails the build on an Amplitude policy violation; false reports only.'
        type: boolean
        default: false
      standards-repo:
        type: string
        default: Dobeu-tech-eco/standards
      standards-ref:
        type: string
        default: main
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect stack
        id: detect
        env:
          STACK_INPUT: ${{ inputs.stack }}
        run: |
          stack="$STACK_INPUT"
          if [ "$stack" = auto ]; then
            has_py=false; has_node=false
            if [ -f pyproject.toml ]; then has_py=true; fi
            if [ -f package.json ]; then has_node=true; fi
            if   $has_py && $has_node; then stack=both
            elif $has_py;              then stack=python
            elif $has_node;            then stack=node
            else                            stack=none
            fi
          fi
          echo "stack=$stack" >>"$GITHUB_OUTPUT"
          echo "Resolved stack: $stack"
          pm=npm
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; fi
          if [ -f yarn.lock ]; then pm=yarn; fi
          echo "pm=$pm" >>"$GITHUB_OUTPUT"

      - if: steps.detect.outputs.stack == 'node' || steps.detect.outputs.stack == 'both'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - if: steps.detect.outputs.stack == 'python' || steps.detect.outputs.stack == 'both'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install dependencies
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          UV_PIN: ${{ inputs.uv-version }}
        run: |
          case "$STACK" in
            node|both)
              if [ "$PM" = pnpm ]; then
                corepack enable
                pnpm install --frozen-lockfile
              elif [ "$PM" = yarn ]; then
                corepack enable
                yarn install --immutable
              elif [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi
              ;;
          esac
          case "$STACK" in
            python|both)
              python -m pip install "uv==$UV_PIN"
              if [ -f uv.lock ]; then uv sync --frozen; else uv sync; fi
              ;;
          esac

      # Each gate runs the override when given, else the stack default, else skips
      # with a visible SKIP line. A missing gate is reported, never silently passed.
      - name: Test
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.test-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both) cmd='uv run pytest -q' ;;
              node)
                if grep -q '"test"' package.json 2>/dev/null; then cmd="$PM test"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP test — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      - name: Lint
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.lint-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both) cmd='uv run ruff check . && uv run ruff format --check .' ;;
              node)
                if grep -q '"lint"' package.json 2>/dev/null; then cmd="$PM run lint"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP lint — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      - name: Typecheck
        env:
          STACK: ${{ steps.detect.outputs.stack }}
          PM: ${{ steps.detect.outputs.pm }}
          OVERRIDE: ${{ inputs.typecheck-cmd }}
        run: |
          cmd="$OVERRIDE"
          if [ -z "$cmd" ]; then
            case "$STACK" in
              python|both)
                if [ -d src ]; then cmd='uv run mypy --strict src'; fi
                ;;
              node)
                if grep -qE '"(typecheck|type-check)"' package.json 2>/dev/null; then cmd="$PM run typecheck"; fi
                ;;
            esac
          fi
          if [ -z "$cmd" ]; then echo "SKIP typecheck — no command detected or configured."; exit 0; fi
          echo "+ $cmd"
          eval "$cmd"

      # Portfolio policy gate. Needs its own checkout because the job's working
      # tree is the CALLER, not the standards repo. A private standards repo
      # needs a token with read access here — GITHUB_TOKEN will not reach it,
      # so the fetch carries the same continue-on-error as the check itself.
      - name: Fetch standards checks
        continue-on-error: ${{ !inputs.enforce-amplitude }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.standards-repo }}
          ref: ${{ inputs.standards-ref }}
          path: .standards
          persist-credentials: false

      - name: Amplitude instrumentation policy
        continue-on-error: ${{ !inputs.enforce-amplitude }}
        run: node .standards/checks/check-amplitude.mjs .
